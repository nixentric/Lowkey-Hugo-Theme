{{ $favicon := resources.GetMatch (site.Params.favicon | default "icons/favicon.ico") }}

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}</title>
<meta
  name="description"
  content="{{ if .IsHome }}{{ .Site.Params.description }}{{ else }}{{ or .Params.description .Summary }}{{ end }}"
/>
<link rel="canonical" href="{{ .Permalink }}" />

<link rel="icon" type="image/x-icon" href="{{ $favicon.RelPermalink }}" />

{{ partial "google_analytics.html" . }}

<script>
  document.documentElement.classList.toggle(
    'dark',
    (sessionStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark'
  );
</script>
