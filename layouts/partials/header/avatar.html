{{ with resources.GetMatch (site.Params.avatar | default "img/profile-picture.jpg") }}
{{ $tiny := .Fill "160x160 q90" }}

<div class="flex-none w-20 h-20 rounded-full overflow-hidden">
  <a href="{{ site.BaseURL }}">
    <img src="{{ $tiny.RelPermalink }}" width="80" height="80" alt="{{ site.Title }}" />
  </a>
</div>
{{ end }}
