# Homepage Config
# true: the home page shows only its own text. false: it also lists the latest posts.
isSinglePage = false
# true: the home page is the whole blog with its own pages. false: older posts continue on /posts/.
homePagination = false

# Meta Config
description = "Hello"

# Header Configuration
avatar = "img/profile-picture.jpg"

#favicon
favicon = "icons/favicon.ico"

[emoji]
enableEmoji = true

# giscus is a comment system based on GitHub Discussions. see https://giscus.app
[giscus]       
    enable = false
    repo = ""
    repoId = ""
    category = "Announcements"
    categoryId = ""
