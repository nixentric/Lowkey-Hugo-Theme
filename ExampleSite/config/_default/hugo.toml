baseURL = 'https://lowkey.nixentric.com/' # Change to your own domain
copyright = "{year}" # To make 2007 - 2022. Just add before {year} example: 2007 - {year}
locale = 'en-US'
defaultContentLanguage = 'en'
theme = 'enchanted-lowkey'
title = 'Lowkey Hugo'
enableRobotsTXT = true
summaryLength = 15

[pagination]
  pagerSize = 5

# disqus is a comment system. see https://disqus.com
[services.disqus]
  shortname = ''

[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ''
    hl_inline = false
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = false
    noClasses = true
    noHl = false
    style = 'dracula'
    tabWidth = 4
